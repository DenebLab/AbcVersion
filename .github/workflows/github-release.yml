name: Publish GitHub Release (native binaries)

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset_name: abcversion-linux-x64
            output_name: Deneblab.AbcVersionCmd
          - os: windows-latest
            rid: win-x64
            asset_name: abcversion-win-x64.exe
            output_name: Deneblab.AbcVersionCmd.exe
          # macos-latest is Apple Silicon. Intel macOS is only available on the
          # -intel/-large larger-runner labels, so osx-x64 is deliberately not built.
          - os: macos-latest
            rid: osx-arm64
            asset_name: abcversion-osx-arm64
            output_name: Deneblab.AbcVersionCmd
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Important for version calculation

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Install Native AOT prerequisites (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev

    - name: Install AbcVersion tool
      shell: bash
      run: dotnet tool install --global Deneblab.AbcVersionCmd

    - name: Get version
      id: get_version
      shell: bash
      run: |
        VERSION=$(abcversion -p semversion)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"

    # Windows must use the PowerShell bootstrap. Running build.sh through Git Bash
    # mangles MSBuild's /p: switch (the leading slash is stripped, so MSBuild reads
    # "p:UseSharedCompilation=false" as a second project file and fails with MSB1008).
    - name: Build native AOT binary (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: ./build.sh --target GithubRelease --rid ${{ matrix.rid }}

    - name: Build native AOT binary (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./build.ps1 --target GithubRelease --rid ${{ matrix.rid }}

    - name: Stage release asset
      shell: bash
      run: |
        mkdir -p staging
        cp ".fallout/temp/w/AbcVersion.Cmd/github-release/${{ matrix.rid }}/${{ matrix.output_name }}" \
          "staging/${{ matrix.asset_name }}"

    # Written in `sha256sum` format (digest, two spaces, bare filename) so that both
    # `sha256sum -c` and macOS's `shasum -a 256 -c` verify it unmodified. Generated from
    # inside staging/ so the recorded name has no directory component. macOS images have
    # no sha256sum, hence the fallback.
    - name: Generate checksum
      shell: bash
      working-directory: staging
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
        else
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
        fi
        cat "${{ matrix.asset_name }}.sha256"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: |
          staging/${{ matrix.asset_name }}
          staging/${{ matrix.asset_name }}.sha256
        if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Important for version calculation

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install AbcVersion tool
      run: dotnet tool install --global Deneblab.AbcVersionCmd

    - name: Get version
      id: get_version
      run: |
        VERSION=$(abcversion -p semversion)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: v${{ steps.get_version.outputs.version }}
        files: release-assets/*
